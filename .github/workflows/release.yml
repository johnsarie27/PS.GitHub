name: release
run-name: release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # v0.1.0
      #- "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+" # v0.1.0-rc01

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/release.yml@v1
    with:
      artifact-name: 'PS.GitHub-${{ github.ref_name }}'
    permissions:
      contents: write
