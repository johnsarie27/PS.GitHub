name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - shell: pwsh # install dependencies (Pester, psake, PSScriptAnalyzer)
        run: ./Build/build.ps1 -ResolveDependency -TaskList 'Init'

      - shell: pwsh # stage module (copy sources into Staging/)
        run: ./Build/build.ps1 -TaskList 'CombineFunctionsAndStage'

      - shell: pwsh # psscriptanalyzer
        run: ./Build/build.ps1 -TaskList 'Analyze'

      - shell: pwsh # pester
        run: ./Build/build.ps1 -TaskList 'Test'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Pester Results (${{ matrix.os }})
          path: "Artifacts/**/Test-*.xml"
          if-no-files-found: warn

      - name: Publish Pester results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        # Only publish when a JUnit file actually exists. Before the first
        # Pester test lands (PR-B), the Test task runs cleanly but produces
        # no XML; skipping here keeps CI green during scaffolding without
        # weakening the check once real tests exist.
        if: always() && hashFiles('Artifacts/**/Test-*.xml') != ''
        with:
          name: Pester Tests (${{ matrix.os }})
          path: Artifacts/**/Test-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
